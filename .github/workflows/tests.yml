name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integridad:
    name: Integridad del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar archivos obligatorios
        run: |
          set -eu
          for archivo in app/main.py requirements.txt requirements-dev.txt .env.example README.md \
                         app/atlas/data/alcaldias-cdmx.geojson; do
            test -s "$archivo" || { echo "Falta $archivo"; exit 1; }
          done

      - name: Verificar que no se publiquen credenciales
        run: |
          set -eu
          # Se excluye .github porque este mismo archivo enumera los patrones:
          # buscarlos sobre sí mismo produce un positivo falso.
          # Las credenciales canónicas de documentación (usuario:clave@host) y los
          # marcadores de plantilla (<VAR>) no son secretos: se descartan antes de
          # decidir. Los formatos criptográficos de token jamás se eximen.
          detectadas=$(grep -rIn --exclude-dir=.git --exclude-dir=.github -E \
            '(mongodb(\+srv)?://[^"[:space:]]*:[^"[:space:]]*@|sk-[A-Za-z0-9]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' . \
            | grep -vE 'mongodb(\+srv)?://[^:]+:<[A-Za-z0-9_]+>@' \
            | grep -vE 'mongodb(\+srv)?://(usuario|user|username):(clave|pass|password|contraseña)@' || true)
          if [ -n "$detectadas" ]; then
            echo "$detectadas"; echo "Se detectaron posibles credenciales"; exit 1
          fi
          echo "Sin credenciales detectadas"

  dominio:
    name: Dominio sin infraestructura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ejecutar pruebas de dominio (sin MongoDB)
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27099/hugo_portfolio_test
        run: |
          set -eu
          python -m pytest -m "not integracion" -ra -q \
            --junitxml=resultados/dominio.xml

      - name: Comprobar que se ejecutaron pruebas y no dependen de MongoDB
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          raiz = ET.parse("resultados/dominio.xml").getroot()
          suites = [raiz] if raiz.tag == "testsuite" else list(raiz)
          total = sum(int(s.get("tests", 0)) for s in suites)
          omitidas = sum(int(s.get("skipped", 0)) for s in suites)
          ejecutadas = total - omitidas
          print(f"dominio: total={total} omitidas={omitidas} ejecutadas={ejecutadas}")
          if ejecutadas <= 0:
              print("ERROR: el job de dominio no ejecutó ninguna prueba")
              sys.exit(1)
          PY

      - name: Comprobar sintaxis de los scripts
        run: python -m compileall -q .

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-dominio
          path: resultados/
          if-no-files-found: warn

  imagen:
    name: Imagen Docker (build, snapshots y salud)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build --tag portfolio-api:ci .

      - name: Verificar que los snapshots de runtime están en la imagen
        run: |
          set -eu
          # Sin estos tres archivos la API no arranca: los servicios los leen en
          # su constructor. El check es sobre la imagen, no sobre el repositorio.
          docker run --rm portfolio-api:ci sh -c '
            set -eu
            for archivo in \
              /app/data/snapshots/banxico/corpus.json \
              /app/data/snapshots/copiloto/data.json \
              /app/data/snapshots/incident-commander/data.json; do
              test -s "$archivo" || { echo "Falta $archivo en la imagen"; exit 1; }
            done
            ls -l /app/data/snapshots/*/*.json
            echo "snapshots presentes en la imagen"
          '

      - name: Comprobar que los servicios abren los snapshots dentro de la imagen
        run: |
          set -eu
          docker run --rm portfolio-api:ci python -c "
          from app.config import get_settings
          from app.nl_sql.service import CopilotoNlSql
          from app.incident_commander.service import IncidentCommander
          from app.rag_banxico.service import BriefingBanxico
          ajustes = get_settings()
          CopilotoNlSql(None, ajustes)
          IncidentCommander(ajustes)
          BriefingBanxico(None, ajustes)
          print('los tres servicios abren sus snapshots dentro de la imagen')
          "

      - name: Arrancar el contenedor y comprobar /health/live
        run: |
          set -eu
          docker run -d --name api-ci -p 18000:8000 portfolio-api:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/v1/health/live; then
              echo; ok=1; break
            fi
            sleep 2
          done
          docker logs api-ci
          test "$ok" = 1 || { echo "La API no respondió a /api/v1/health/live"; exit 1; }
          # El proceso corre como usuario sin privilegios y la carpeta del
          # índice SQLite del Copiloto es escribible.
          docker exec api-ci id
          docker exec api-ci test -w /app/data/copiloto_nl_sql

      - name: La geometría de alcaldías viaja en la imagen
        run: |
          set -eu
          # El mapa del tablero se dibuja con este GeoJSON: si falta en la
          # imagen, /geometria responde con features vacío y el mapa no aparece.
          docker exec api-ci python -c "
          import json, urllib.request
          datos = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/atlas-vial/geometria', timeout=10))
          total = len(datos.get('features') or [])
          print('alcaldías en la imagen:', total)
          assert total == 16, f'se esperaban 16 alcaldías, hay {total}'
          "

      - name: Registro del contenedor y limpieza
        if: always()
        run: |
          docker rm -f api-ci || true

  integracion:
    name: Integración con MongoDB
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_TEST_DB: hugo_portfolio_test
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/hugo_portfolio_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Esperar a MongoDB de pruebas
        run: |
          set -eu
          # Timeout acotado con diagnóstico sin secretos: solo se informa el tipo
          # de error, nunca la cadena de conexión.
          python - <<'PY'
          import os, sys, time
          from pymongo import MongoClient
          from pymongo.errors import PyMongoError

          uri = os.environ["MONGODB_TEST_URI"]
          limite = time.time() + 60
          ultimo = None
          while time.time() < limite:
              cliente = MongoClient(uri, serverSelectionTimeoutMS=2000)
              try:
                  cliente.admin.command("ping")
                  print("MongoDB de pruebas disponible")
                  print("base usada:", os.environ["MONGODB_TEST_DB"])
                  sys.exit(0)
              except PyMongoError as error:
                  ultimo = type(error).__name__
              finally:
                  cliente.close()
              time.sleep(3)
          print(f"ERROR: MongoDB no respondió en 60 s ({ultimo})")
          sys.exit(1)
          PY

      - name: Ejecutar pruebas de integración
        run: |
          set -eu
          python -m pytest -m integracion -ra -q \
            --junitxml=resultados/integracion.xml

      - name: Comprobar que se ejecutaron pruebas de integración
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          raiz = ET.parse("resultados/integracion.xml").getroot()
          suites = [raiz] if raiz.tag == "testsuite" else list(raiz)
          total = sum(int(s.get("tests", 0)) for s in suites)
          omitidas = sum(int(s.get("skipped", 0)) for s in suites)
          ejecutadas = total - omitidas
          print(f"integracion: total={total} omitidas={omitidas} ejecutadas={ejecutadas}")
          if ejecutadas <= 0:
              print("ERROR: el job de integración no ejecutó ninguna prueba con MongoDB disponible")
              sys.exit(1)
          if omitidas:
              print("Aviso: hay omisiones; revisa los motivos con pytest -ra (boletines CNBV no redistribuidos).")
          PY

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-integracion
          path: resultados/
          if-no-files-found: warn
